version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_URL=${API_URL}
        - VITE_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - coolify

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@ethnostyles.com}
      - WEB_URL=${WEB_URL}
      - API_URL=${API_URL}
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.services.api-backend.loadbalancer.server.port=3000"
      - "traefik.http.routers.api-router.rule=Host(`api-cswcoc08w0c84sgocsswok04.157.180.43.90.sslip.io`) || Host(`api-pwgsgko4og0g48gkkowk8gcw.157.180.43.90.sslip.io`) || Host(`v0gss44sc84osg8k888kws4o.157.180.43.90.sslip.io`)"
      - "traefik.http.routers.api-router.entryPoints=http"
      - "traefik.http.routers.api-router.service=api-backend"
      - "traefik.http.routers.api-router.priority=10000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - coolify

networks:
  coolify:
    external: true
