version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_URL=${API_URL}
        - VITE_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ethnostyle-web.rule=Host(`cswcoc08w0c84sgocsswok04.157.180.43.90.sslip.io`) && !PathPrefix(`/api`) && !PathPrefix(`/health`)"
      - "traefik.http.routers.ethnostyle-web.entrypoints=http"
      - "traefik.http.routers.ethnostyle-web.priority=1"
      - "traefik.http.services.ethnostyle-web.loadbalancer.server.port=80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - coolify

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@ethnostyles.com}
      - WEB_URL=${WEB_URL}
      - API_URL=${API_URL}
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ethnostyle-api.rule=Host(`cswcoc08w0c84sgocsswok04.157.180.43.90.sslip.io`) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      - "traefik.http.routers.ethnostyle-api.entrypoints=http"
      - "traefik.http.routers.ethnostyle-api.priority=2"
      - "traefik.http.services.ethnostyle-api.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - coolify

networks:
  coolify:
    external: true
